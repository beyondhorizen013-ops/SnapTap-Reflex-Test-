<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REFLEX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #game-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      width: 100%;
      max-width: 520px;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: #0e0e0e;
      border: 0.5px solid #333;
      border-radius: 8px;
      padding: 8px 16px;
      text-align: center;
      min-width: 80px;
    }
    .stat-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
    .stat-val { font-size: 20px; font-weight: 500; color: #f0f0f0; }
    .stat-val.combo { color: #e05c2a; }
    .stat-val.level { color: #c084fc; }
    #arena {
      width: 100%;
      height: 340px;
      background: #0a0a0a;
      border: 0.5px solid #222;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }
    #arena.shake { animation: shake 0.25s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .target {
      position: absolute;
      border-radius: 50%;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hit-flash {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: hitfade 0.35s ease forwards;
    }
    @keyframes hitfade {
      0% { opacity: 1; transform: scale(0.8); }
      100% { opacity: 0; transform: scale(2); }
    }
    #level-banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .level-text {
      font-size: 28px;
      font-weight: 500;
      color: #c084fc;
      letter-spacing: 0.12em;
      animation: levelPop 0.7s ease forwards;
    }
    @keyframes levelPop {
      0% { opacity: 0; transform: scale(0.6); }
      40% { opacity: 1; transform: scale(1.1); }
      70% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      border-radius: 12px;
      gap: 10px;
      z-index: 20;
    }
    #overlay h2 { font-size: 22px; font-weight: 500; color: #f0f0f0; letter-spacing: 0.04em; }
    #overlay .sub { font-size: 13px; color: #555; }
    #overlay .score-big { font-size: 40px; font-weight: 500; color: #e05c2a; }
    #start-btn {
      margin-top: 8px;
      padding: 10px 28px;
      background: #e05c2a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #c44d20; }
    #timer-bar-wrap {
      width: 100%;
      height: 3px;
      background: #111;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    #timer-bar { height: 100%; background: #e05c2a; border-radius: 2px; transition: width 0.1s linear; }
    #lives { display: flex; gap: 6px; margin-top: 2px; }
    .life-dot { width: 8px; height: 8px; border-radius: 50%; background: #e05c2a; }
    .life-dot.dead { background: #222; }
    #miss-zone { position: absolute; inset: 0; z-index: 0; }
  </style>
</head>
<body>
  <div id="game-root">
    <div id="hud">
      <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-val" id="score-display">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Combo</div>
        <div class="stat-val combo" id="combo-display">x1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Level</div>
        <div class="stat-val level" id="level-display">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Best</div>
        <div class="stat-val" id="best-display">0</div>
      </div>
    </div>

    <div id="arena">
      <div id="miss-zone"></div>
      <div id="level-banner"></div>
      <div id="overlay">
        <h2>REFLEX</h2>
        <div class="sub">Targets get faster. Don't blink.</div>
        <div id="lives"></div>
        <button id="start-btn">PLAY</button>
      </div>
    </div>

    <div id="timer-bar-wrap">
      <div id="timer-bar" style="width:100%"></div>
    </div>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score-display');
    const comboEl = document.getElementById('combo-display');
    const levelEl = document.getElementById('level-display');
    const bestEl = document.getElementById('best-display');
    const timerBar = document.getElementById('timer-bar');
    const startBtn = document.getElementById('start-btn');
    const livesEl = document.getElementById('lives');
    const missZone = document.getElementById('miss-zone');
    const levelBanner = document.getElementById('level-banner');

    let score = 0, combo = 1, lives = 3, best = 0, level = 1;
    let gameRunning = false;
    let targets = [];
    let spawnTimer, tickInterval;
    let gameTime = 60, timeLeft = 60;
    let hitsThisLevel = 0;
    const hitsPerLevel = 8;

    function getLevelConfig(lvl) {
      return {
        spawnMs:    Math.max(350, 1100 - (lvl - 1) * 110),
        lifespanMs: Math.max(500, 1600 - (lvl - 1) * 150),
        minSize:    Math.max(22, 38 - (lvl - 1) * 3),
        maxSize:    Math.max(28, 52 - (lvl - 1) * 3),
        maxTargets: Math.min(2 + Math.floor((lvl - 1) / 2), 5),
      };
    }

    function renderLives(count) {
      livesEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const d = document.createElement('div');
        d.className = 'life-dot' + (i >= count ? ' dead' : '');
        livesEl.appendChild(d);
      }
    }

    function showLevelBanner(lvl) {
      levelBanner.innerHTML = '';
      const t = document.createElement('div');
      t.className = 'level-text';
      t.textContent = 'LEVEL ' + lvl;
      levelBanner.appendChild(t);
      setTimeout(() => { levelBanner.innerHTML = ''; }, 750);
    }

    function startGame() {
      score = 0; combo = 1; lives = 3; level = 1; timeLeft = gameTime; hitsThisLevel = 0;
      gameRunning = true;
      targets.forEach(t => t.el && t.el.remove());
      targets = [];
      updateHUD();
      renderLives(3);
      overlay.style.display = 'none';
      timerBar.style.background = '#e05c2a';
      timerBar.style.width = '100%';
      scheduleSpawn();
      tickInterval = setInterval(tick, 100);
      spawnTarget();
    }

    function scheduleSpawn() {
      clearTimeout(spawnTimer);
      spawnTimer = setTimeout(() => {
        if (!gameRunning) return;
        const activeTargets = targets.filter(t => t.alive).length;
        if (activeTargets < getLevelConfig(level).maxTargets) spawnTarget();
        scheduleSpawn();
      }, getLevelConfig(level).spawnMs);
    }

    function tick() {
      timeLeft -= 0.1;
      const pct = Math.max(0, timeLeft / gameTime * 100);
      timerBar.style.width = pct + '%';
      if (pct < 25) timerBar.style.background = '#c44d20';
      if (timeLeft <= 0) endGame();
    }

    function spawnTarget() {
      if (!gameRunning) return;
      const cfg = getLevelConfig(level);
      const size = cfg.minSize + Math.random() * (cfg.maxSize - cfg.minSize);
      const maxX = arena.clientWidth - size - 10;
      const maxY = arena.clientHeight - size - 10;
      const x = 10 + Math.random() * maxX;
      const y = 10 + Math.random() * maxY;

      const el = document.createElement('div');
      el.className = 'target';
      const borderColor = level <= 3 ? '#e05c2a' : level <= 6 ? '#dc2626' : '#a855f7';
      const coreColor   = level <= 3 ? '#e05c2a' : level <= 6 ? '#dc2626' : '#a855f7';
      el.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:#111;border:1.5px solid ${borderColor};z-index:2;`;

      const inner = document.createElement('div');
      inner.style.cssText = `width:${size*0.35}px;height:${size*0.35}px;background:${coreColor};border-radius:50%;pointer-events:none;`;
      el.appendChild(inner);

      const t = { el, x, y, size, alive: true, color: coreColor };
      targets.push(t);
      arena.appendChild(el);

      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (!t.alive) return;
        hitTarget(t);
      });

      t.timeout = setTimeout(() => {
        if (t.alive) missTarget(t);
      }, cfg.lifespanMs);
    }

    function hitTarget(t) {
      t.alive = false;
      clearTimeout(t.timeout);
      t.el.remove();
      targets = targets.filter(x => x !== t);

      const pts = 10 * combo * level;
      score += pts;
      combo = Math.min(combo + 1, 10);
      hitsThisLevel++;

      if (hitsThisLevel >= hitsPerLevel) {
        hitsThisLevel = 0;
        level++;
        levelEl.textContent = level;
        showLevelBanner(level);
        scheduleSpawn();
      }

      updateHUD();
      showFlash(t.x + t.size / 2, t.y + t.size / 2, t.color, t.size);
    }

    function missTarget(t) {
      if (!t.alive) return;
      t.alive = false;
      clearTimeout(t.timeout);
      t.el.style.opacity = '0.15';
      setTimeout(() => { t.el.remove(); targets = targets.filter(x => x !== t); }, 200);
      combo = 1;
      lives--;
      renderLives(lives);
      updateHUD();
      arena.classList.add('shake');
      setTimeout(() => arena.classList.remove('shake'), 260);
      if (lives <= 0) endGame();
    }

    missZone.addEventListener('pointerdown', () => {
      if (!gameRunning) return;
      combo = 1;
      updateHUD();
    });

    function showFlash(cx, cy, color, size) {
      const f = document.createElement('div');
      f.className = 'hit-flash';
      const s = size * 0.8;
      f.style.cssText = `width:${s}px;height:${s}px;left:${cx-s/2}px;top:${cy-s/2}px;background:${color};z-index:5;`;
      arena.appendChild(f);
      setTimeout(() => f.remove(), 380);
    }

    function updateHUD() {
      scoreEl.textContent = score;
      comboEl.textContent = 'x' + combo;
      levelEl.textContent = level;
      if (score > best) { best = score; bestEl.textContent = best; }
    }

    function endGame() {
      gameRunning = false;
      clearTimeout(spawnTimer);
      clearInterval(tickInterval);
      targets.forEach(t => { if (t.alive) { clearTimeout(t.timeout); t.el && t.el.remove(); } });
      targets = [];

      overlay.innerHTML = '';
      overlay.style.display = 'flex';

      const tag = document.createElement('div');
      tag.style.cssText = 'font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.12em;';
      tag.textContent = 'GAME OVER';

      const lvlReached = document.createElement('div');
      lvlReached.style.cssText = 'font-size:13px;color:#c084fc;';
      lvlReached.textContent = 'Level ' + level + ' reached';

      const s = document.createElement('div');
      s.className = 'score-big';
      s.textContent = score;

      const sub = document.createElement('div');
      sub.className = 'sub';
      const isNewBest = score >= best && score > 0;
      sub.textContent = isNewBest ? 'NEW BEST' : 'Best: ' + best;
      if (isNewBest) sub.style.color = '#e05c2a';

      const livDiv = document.createElement('div');
      livDiv.style.cssText = 'display:flex;gap:6px;';
      for (let i = 0; i < 3; i++) {
        const d = document.createElement('div');
        d.className = 'life-dot dead';
        livDiv.appendChild(d);
      }

      const btn = document.createElement('button');
      btn.id = 'start-btn';
      btn.textContent = 'PLAY AGAIN';
      btn.style.cssText = 'margin-top:8px;padding:10px 28px;background:#e05c2a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;';
      btn.onclick = startGame;

      overlay.appendChild(tag);
      overlay.appendChild(s);
      overlay.appendChild(lvlReached);
      overlay.appendChild(sub);
      overlay.appendChild(livDiv);
      overlay.appendChild(btn);
    }

    startBtn.addEventListener('click', startGame);
    renderLives(3);
    bestEl.textContent = '0';
  </script>
</body>
</html>
