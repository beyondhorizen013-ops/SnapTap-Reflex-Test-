<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFLEX TEST | ORANGE</title>
    <style>
        body {
            margin: 0;
            background: #0d0905; /* Darker brown/black for orange contrast */
            color: #ff9d00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #hud {
            margin-bottom: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6a00;
        }
        #game {
            width: 90vw;
            max-width: 600px;
            height: 70vh;
            background: #1a140f; /* Warm dark surface */
            border: 3px solid #ff6a00;
            border-radius: 8px;
            position: relative;
            cursor: crosshair;
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(255, 106, 0, 0.3);
        }
        .target {
            background: linear-gradient(145deg, #ff9d00, #ff4500);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 20px #ff6a00, 0 0 40px #ff4500;
            border: 2px solid #fff;
        }
        button {
            margin-top: 20px;
            padding: 12px 40px;
            background: #ff6a00;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 0 10px #ff6a00;
        }
        button:hover {
            background: #ff9d00;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="hud">SCORE: <span id="score">0</span> | BEST: <span id="best">0</span></div>
    
    <div id="game"></div>

    <button id="startBtn">START MISSION</button>

    <script>
        const game = document.getElementById("game");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const startBtn = document.getElementById("startBtn");

        let score = 0;
        let best = localStorage.getItem("best") || 0;
        let active = false;
        bestEl.textContent = best;

        function spawn() {
            if (!active) return;
            game.innerHTML = ""; 

            const target = document.createElement("div");
            target.className = "target";

            // Difficulty Scaling
            const size = Math.max(25, 55 - Math.floor(score / 4) * 3);
            target.style.width = size + "px";
            target.style.height = size + "px";

            const x = Math.random() * (game.clientWidth - size);
            const y = Math.random() * (game.clientHeight - size);
            target.style.left = x + "px";
            target.style.top = y + "px";

            // Timing logic
            const speed = Math.max(450, 1100 - (score * 25));
            const timer = setTimeout(() => {
                if (active) endGame();
            }, speed);

            target.onclick = (e) => {
                e.stopPropagation(); 
                clearTimeout(timer);
                score++;
                scoreEl.textContent = score;
                if (score > best) {
                    best = score;
                    localStorage.setItem("best", best);
                    bestEl.textContent = best;
                }
                spawn();
            };

            game.appendChild(target);
        }

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            active = true;
            startBtn.style.display = "none";
            spawn();
        }

        function endGame() {
            active = false;
            game.innerHTML = "";
            startBtn.style.display = "block";
            startBtn.textContent = "RETRY";
            alert("MISSION FAILED! Score: " + score);

            // The nearly impossible Gemini link
            if (Math.random() < Math.pow(0.01, 500000000)) {
                window.location.href = "https://gemini.com";
            }
        }

        startBtn.onclick = startGame;
    </script>
</body>
</html>
